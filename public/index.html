<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <meta name="theme-color" content="#0F172A">
    <meta name="description" content="Baki'nin Mutfağı - Akıllı Gastronomi, Yemek Tarifleri ve Sosyal Keşfet Platformu">
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/logo192.png">
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png">
    <title>Baki'nin Mutfağı | Akıllı Gastronomi</title>
</head>
<body>
    <noscript>Uygulamanın çalışması için JavaScript gereklidir.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('%PUBLIC_URL%/sw.js').then(function(registration) {
            console.log('SW Registered: ', registration.scope);
          }, function(err) {
            console.log('SW Registration failed: ', err);
          });
        });
      }
    </script>
</body>
</html>
